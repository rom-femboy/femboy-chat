<style>
:root{--bg:#f4f5f7;--tx:#1b1f24;--ac:#2b7de9;--pan:rgba(255,255,255,.55);--bd:rgba(128,128,128,.25)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}
nav{display:flex;gap:6px;align-items:center;padding:10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
nav .sp{flex:1}
button,select{font:inherit;color:inherit;background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.tab.on{border-color:var(--ac);font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:inline-flex;align-items:center;justify-content:center;object-fit:cover;flex:none;font-weight:600}
.big{width:96px;height:96px;font-size:36px}
#login{margin:auto;text-align:center;padding:20px}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:85%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--pan);border:1px solid var(--bd);padding:8px 10px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.me .bub{background:color-mix(in srgb,var(--ac) 22%,transparent)}
.bub b{display:block;font-size:12px;color:var(--ac)}.bub img{max-width:100%;max-height:280px;border-radius:8px;display:block}
#bar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd);align-items:flex-end}
textarea,input[type=text]{flex:1;font:inherit;color:inherit;background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;outline:0;width:100%}
#prof{flex:1;overflow:auto;padding:14px;display:grid;gap:14px;grid-template-columns:1fr 1fr;align-content:start}
.card{border:1px solid var(--bd);border-radius:14px;padding:14px;background:var(--pan)}
.card h3{margin:0 0 10px}.row{display:grid;grid-template-columns:20px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.sw{width:100%;height:28px;border-radius:8px;border:1px solid var(--bd);margin:4px 0 10px}
input[type=range]{width:100%}.rec{color:#e5484d}
@media(max-width:700px){#prof{grid-template-columns:1fr}}
[hidden]{display:none!important}
#gt{padding:8px}
input[type=password]{font:inherit;color:inherit;background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;outline:0;width:100%}
#login{max-width:420px;width:100%}#login p{margin:8px 0}.hint{font-size:13px;opacity:.75}
#adm{flex:1;overflow:auto;padding:14px;display:grid;gap:14px;align-content:start}
.ur{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}.ur span{flex:1;min-width:120px}
</style></head><body>
<div id="app">
 <nav>
  <b>💬 Messenger</b>
  <button class="tab on" id="tChat" hidden></button><button class="tab" id="tProf" hidden></button><button class="tab" id="tAdm" hidden>🛡</button>
  <span class="sp"></span>
  <select id="lang"></select>
  <button id="out" hidden></button>

 </div>
</div>
