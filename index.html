<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фембойский чатик</title>
<style>
:root{--bg:#f4f5f7;--tx:#1b1f24;--ac:#2b7de9;--pan:rgba(255,255,255,.55);--bd:rgba(128,128,128,.25)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}
nav{display:flex;gap:6px;align-items:center;padding:10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
nav .sp{flex:1}
button,select{font:inherit;color:inherit;background:var(--pan);border:1px solid var(--bd);border-radius:var(--rad,10px);padding:8px 12px;cursor:pointer}
.pri{background:var(--pri,var(--ac));color:#fff;border-color:var(--pri,var(--ac))}
.tab.on{border-color:var(--ac);font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:inline-flex;align-items:center;justify-content:center;object-fit:cover;flex:none;font-weight:600}
.big{width:96px;height:96px;font-size:36px}
#login{margin:auto;text-align:center;padding:20px}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:85%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--pan);border:1px solid var(--bd);padding:8px 10px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.me .bub{background:color-mix(in srgb,var(--ac) 22%,transparent)}
.bub b{display:block;font-size:12px;color:var(--ac)}.bub img{max-width:100%;max-height:280px;border-radius:8px;display:block}
#bar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd);align-items:flex-end}
textarea,input[type=text]{flex:1;font:inherit;color:inherit;background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;outline:0;width:100%}
#prof{flex:1;overflow:auto;padding:14px;display:grid;gap:14px;grid-template-columns:1fr 1fr;align-content:start}
.card{border:1px solid var(--bd);border-radius:14px;padding:14px;background:var(--pan)}
.card h3{margin:0 0 10px}.row{display:grid;grid-template-columns:20px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.sw{width:100%;height:28px;border-radius:8px;border:1px solid var(--bd);margin:4px 0 10px}
input[type=range]{width:100%}.rec{color:#e5484d}
@media(max-width:700px){#prof{grid-template-columns:1fr}}
[hidden]{display:none!important}
#gt{padding:8px}
input[type=password]{font:inherit;color:inherit;background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;outline:0;width:100%}
#login{max-width:420px;width:100%}#login p{margin:8px 0}.hint{font-size:13px;opacity:.75}
#adm{flex:1;overflow:auto;padding:14px;display:grid;gap:14px;align-content:start}
.ur{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}.ur span{flex:1;min-width:120px}
dialog{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;max-width:420px;width:92%;max-height:85vh;overflow:auto}dialog::backdrop{background:#0008}
#rbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--bd)}#rbar select{flex:1;min-width:0}
.hit{display:flex;gap:8px;align-items:center;padding:4px 0}.hx{width:100%;font-family:monospace;margin-bottom:8px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.gal div{aspect-ratio:1;background:var(--pan);border:1px solid var(--bd);border-radius:8px;overflow:hidden;position:relative}.gal img{width:100%;height:100%;object-fit:cover;cursor:pointer}
#rbar{border-bottom:0;flex-direction:column;width:200px;flex:none;overflow:auto}
#cmain{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
#chat.l{flex-direction:row}#chat.r{flex-direction:row-reverse}#chat.t{flex-direction:column}
#chat.l #rbar{border-right:1px solid var(--bd)}#chat.r #rbar{border-left:1px solid var(--bd)}
#chat.t #rbar{flex-direction:row;width:auto;border-bottom:1px solid var(--bd);overflow-x:auto;align-items:center}
#rtools{display:flex;gap:4px}#rlist{display:flex;flex-direction:column;gap:4px}#chat.t #rlist{flex-direction:row}
.ri{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ri.on{background:var(--ac);color:#fff}
@media(max-width:700px){#chat.l #rbar,#chat.r #rbar{width:112px}}
#chead{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chip{padding:2px 8px;font-size:13px;border-radius:12px;border:1px solid var(--bd);background:var(--pan)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.m img{cursor:zoom-in}.av.sm{width:24px;height:24px;font-size:12px}.ri{display:flex;align-items:center;gap:6px}
#ep{position:fixed;display:flex;gap:2px;padding:6px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 4px 16px #0004;z-index:50}#ep button{font-size:20px;padding:4px 6px}
#ttl{text-align:center;font-weight:700;font-size:20px;padding:10px 8px 0}
#rtools{flex-wrap:wrap}.rrow{display:flex;gap:2px}.rrow .ri{flex:1;min-width:0}.ri span:not(.bd){overflow:hidden;text-overflow:ellipsis}.mv{padding:4px 6px;font-size:11px}
.bd{background:#e5484d;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;margin-left:auto}
#shop,#own{flex:1;overflow:auto;padding:14px;display:grid;gap:14px;align-content:start}
#splash{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-weight:600;text-align:center;padding:16px}#spgif{width:min(280px,70vw);height:auto;border-radius:14px}.sptitle{font-size:22px}#sptxt{max-width:320px;font-size:15px}
.spin{width:56px;height:56px;border-radius:50%;border:6px solid var(--bd);border-top-color:var(--ac);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.item{border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;background:var(--pan);display:flex;flex-direction:column;gap:6px}
.pv{height:72px;display:flex;align-items:center;justify-content:center;font-size:36px}.pv img{max-height:72px;max-width:100%}
.fw{display:inline-flex;padding:3px;border-radius:50%;position:relative;flex:none}.fw .av{border:2px solid var(--bg)}.fw .fo{position:absolute;inset:-12%;width:124%;height:124%;pointer-events:none}.fw.sm .av{width:24px;height:24px;font-size:12px}
.wall{position:relative;aspect-ratio:1;border:1px solid var(--bd);border-radius:12px;overflow:hidden;container-type:inline-size}
.stk{position:absolute;touch-action:none;transform:translate(-50%,-50%);user-select:none;line-height:1}.stk img{width:100%;display:block;pointer-events:none}.stk.sel{outline:2px dashed var(--ac)}
#cv{background:repeating-conic-gradient(#8885 0 25%,transparent 0 50%) 0 0/16px 16px}
@supports(height:100dvh){html,body,#app{height:100dvh}}
#prof:not([hidden]){display:block!important}#prof{position:relative;overflow:hidden!important;padding:0!important;min-height:0}
#pscroll{height:100%;overflow:auto;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
#chat{position:relative;overflow:hidden;flex-direction:column!important}#cmain{flex:1;width:100%}
#rbar,#fdr{position:absolute!important;z-index:30;background:var(--bg);display:flex!important;flex-direction:column!important;overflow:auto;padding:8px;gap:6px;transition:transform .25s ease;border:0!important;box-shadow:none}
#chat.l #rbar,#prof.l #fdr{left:0;top:0;bottom:0;width:min(320px,86%)!important;transform:translateX(-105%)}
#chat.r #rbar,#prof.r #fdr{right:0;top:0;bottom:0;width:min(320px,86%)!important;transform:translateX(105%)}
#chat.t #rbar,#prof.t #fdr{left:0;right:0;top:0;max-height:78%;width:auto!important;transform:translateY(-105%)}
#chat.open #rbar,#prof.open #fdr{transform:none!important;box-shadow:0 0 24px #0006}
#chat.t #rlist{flex-direction:column!important}
#rshade,#fshade{position:absolute;inset:0;background:#0006;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}#chat.open #rshade,#prof.open #fshade{opacity:1;pointer-events:auto}
#rhead,#fhead{display:flex;align-items:center;gap:8px}#rhead .sp,#fhead .sp{flex:1}#rpos{display:flex;gap:6px;justify-content:center}
#bar{padding:8px;gap:6px;padding-bottom:max(8px,env(safe-area-inset-bottom))}#bar button{min-width:44px;min-height:44px}
textarea{font-size:16px;min-height:44px;max-height:120px}input[type=text],input[type=password]{font-size:16px}
.rx .tl{display:none}.bub.show .rx .tl,.bub:hover .rx .tl{display:inline-block}
@media(max-width:700px){#pscroll{grid-template-columns:1fr}.m{max-width:92%}nav{gap:4px}nav button{padding:8px}}
.rrow{flex-wrap:wrap}.rrow .ri{min-width:90px}
.pv .fo{max-width:none;max-height:none}.pv .fw .av{width:48px;height:48px;font-size:20px}
#spv{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;padding:12px;border:1px dashed var(--bd);border-radius:12px;min-height:80px;margin-bottom:8px}
#spv .cap{font-size:11px;opacity:.7;text-align:center;margin-top:4px}#spv .col{display:flex;flex-direction:column;align-items:center}
input[type=date]{font:inherit;color:inherit;background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;outline:0;width:100%}
.coin{width:1.15em;height:1.15em;vertical-align:-.2em;object-fit:contain}#coins .coin{width:30px;height:30px;vertical-align:-8px}
.rxi{width:20px;height:20px;object-fit:contain;vertical-align:middle}#ep{flex-wrap:wrap;max-width:min(300px,86vw);max-height:40vh;overflow:auto}
.bw{position:relative;display:inline-flex;font-size:36px;flex:none}.bw.big{font-size:96px}.bw.sm{font-size:24px}.bw.sm .av{width:24px;height:24px;font-size:12px}
.as{position:absolute;pointer-events:none;line-height:1;display:flex;align-items:center;justify-content:center}.as img{width:100%;display:block}
.wcv{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;touch-action:none}.wall.drawing .wcv{pointer-events:auto}.wdr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.ic{width:1.3em;height:1.3em;object-fit:contain;vertical-align:middle}
#pe canvas{max-width:100%;display:block}.pestack{position:relative;display:inline-block;max-width:100%}.pestack canvas:last-child{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#game{flex:1;overflow:auto;position:relative}
.ghome{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:100%;padding:20px;animation:gin .3s ease}
.ghome button{min-width:230px;min-height:48px;font-size:17px}.gck{background:none!important;border:0!important;flex-direction:column;align-items:center;display:flex;font-weight:700;font-size:18px;gap:8px}.gck img{width:min(58vw,230px)}
@keyframes gin{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.gpage{padding:14px;display:grid;gap:10px;max-width:700px;margin:0 auto}
.gscr{position:relative;height:100%;display:flex;flex-direction:column}
.gav{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:10px;z-index:3;align-items:flex-end}.gchk{position:absolute;left:-18px;top:50%;transform:translateY(-50%);color:#22c55e;font-weight:900;font-size:20px}
.gmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 70px 20px 20px;text-align:center;font-size:18px;font-weight:600}
.gnum{font-size:min(30vw,160px);font-weight:900}.gcookie{background:none!important;border:0!important;padding:0}.gcookie img{width:min(56vw,260px);user-select:none;-webkit-user-drag:none}
.gbot{display:flex;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.gbot button{flex:1;min-height:50px;font-size:16px}
.grow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);width:100%;max-width:420px}
.bw{isolation:isolate}.bw .as{z-index:2}.fw .fo{z-index:3}
.wg{position:absolute;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:-1;line-height:1;display:flex;justify-content:center}.wg img{width:100%;display:block}
#scat{position:fixed;top:0;bottom:0;left:0;width:min(280px,82vw);background:var(--bg);z-index:60;transform:translateX(-105%);transition:transform .25s;padding:12px;overflow:auto;box-shadow:0 0 24px #0005}#scat.on{transform:none}
#scatbd{position:fixed;inset:0;background:#0006;z-index:59;opacity:0;pointer-events:none;transition:opacity .25s}#scatbd.on{opacity:1;pointer-events:auto}
#ach{flex:1;overflow:auto}
#toasts{position:fixed;top:8px;right:8px;z-index:200;display:flex;flex-direction:column;gap:6px;max-width:min(340px,92vw)}.toast{background:var(--ac);color:#fff;padding:10px 12px;border-radius:12px;box-shadow:0 4px 16px #0005;cursor:pointer;word-break:break-word}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px;vertical-align:middle}.sdot.on{background:#22c55e}.sdot.off{background:#9ca3af}.stat{font-size:12px;opacity:.9;display:block}
</style></head><body>
